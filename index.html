    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <meta name="theme-color" content="#F4F4F4">

    <!-- Open Graph / WhatsApp Sharing -->
    <meta property="og:title" content="URBN BARBER">
    <meta property="og:description" content="Corte rápido, estilo moderno. Agendamento simplificado.">
    <meta property="og:image" content="/logo.png">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Urban Modern Typography */
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Outfit:wght@300;500;700;900&display=swap');
        
        :root {
            --bg-main: #F4F4F4;
            --bg-card: #FFFFFF;
            --text-main: #1C1C1C;
            --text-muted: #666666;
            --primary: #2F6F5E; /* Olive Green */
            --primary-dark: #1A4238;
            --secondary: #D17A22; /* Burnt Orange */
            --border: #E0E0E0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
        }

        .font-header { font-family: 'Outfit', sans-serif; }
        .font-body { font-family: 'DM Sans', sans-serif; }
        
        /* Modern Card Style - Flat with subtle shadow */
        .urban-card {
            background: var(--bg-card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid white;
        }

        /* Modern Buttons */
        .urban-btn {
            background-color: var(--primary);
            color: white;
            transition: all 0.2s ease;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            text-transform: none; /* No uppercase for modern feel */
            letter-spacing: 0;
        }

        .urban-btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .urban-btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid var(--text-main);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .urban-btn-outline:hover {
            background-color: var(--text-main);
            color: white;
        }

        /* Utility */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-in { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(10px); }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Inputs */
        input, select, textarea {
            font-family: 'DM Sans', sans-serif;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0.5;
            cursor: pointer;
        }
    </style>
